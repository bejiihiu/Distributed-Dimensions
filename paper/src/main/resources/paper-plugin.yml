name: DistributedDimensions
# Non-ASCII must stay literal here: expand() reads the file in platform
# encoding and mangles it. Only the ASCII version placeholder goes through it.
description: Paper/Folia + Velocity plugin that distributes the three Minecraft dimensions across independent backend servers.
version: '${version}'

main: kz.bejiihiu.dimensions.paper.DistributedDimensionsPaperPlugin
api-version: '26.3'
load: POSTWORLD
folia-supported: true

# HuskSync is a soft dependency: the plugin works without it (degraded mode),
# but when it is installed we load before it and need linkage access to its
# event classes. Required: false keeps startup working when HuskSync is absent.
dependencies:
  server:
    HuskSync:
      load: BEFORE
      required: false
      join-classpath: true

# Permissions declared for the paper (modern) descriptor dialect. The
# paper-plugin.yml format flattens these two keys at the root (verified
# against Paper's PaperPluginMeta: 'defaultPerm' + 'permissions' map).
# plugin.yml is never read when paper-plugin.yml is present, so this is
# the only place an op-default admin node may live.
defaultPerm: op
permissions:
  distributeddimensions.admin:
    description: "Administrative access to the /dd command tree (info, reload, mirage)"
    default: op

authors: [ bejiihiu.xs ]
