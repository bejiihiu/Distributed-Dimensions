# Distributed Dimensions — сообщения администратора (русский)
# Разметка MiniMessage. Значения из рантайма всегда подставляются unparsed-
# плейсхолдерами, поэтому разметка, введённая оператором, отображается как текст.
# Литеральный '<...>' в значении записывается как '\<'.

brand.header=<gold>Distributed Dimensions</gold> <dark_gray>|</dark_gray> <gray>v<version></gray>

info.server=<gray>сервер:</gray> <version>
info.health.ok=<green>здоровье: HEALTHY</green>
info.health.degraded=<red>здоровье: DEGRADED</red>
info.health.reason=  <red>-</red> <reason>
info.config.source=<gray>конфиг:</gray> источник=<source>, файл-создан=<file-created>
info.config.version=<gray>конфиг:</gray> версия=<version>, миграция=<migration>
info.database=<gray>база данных:</gray> движок=<engine>, пул=<pool-max>/<pool-min>, префикс=<prefix>
info.dimensions.header=<gray>измерения:</gray>
info.dimension.entry=  <dimension> <dark_gray>-></dark_gray> <server>
info.mirage=<gray>mirage:</gray> <green>включён</green>, миров отслеживается: <count>
info.mirage.degraded=<yellow>mirage: <failures> мир(ов) не создалось (см. /dd mirage)</yellow>
info.mirage.disabled=<gray>mirage:</gray> <yellow>отключён</yellow>
info.sync=<gray>синхронизация:</gray> <level> <dark_gray>(фаза=<phase>, ждать-синхронизацию=<wait-for-sync>)</dark_gray>
info.sync.none=<gray>синхронизация:</gray> <yellow>не привязана (сервисы синхронизации недоступны)</yellow>
info.api=<gray>api:</gray> <enabled>
info.compat=<gray>compat:</gray> синтетические-события=<synthetic-events>, выдача-достижений=<grant-advancements>
info.uptime=<gray>аптайм:</gray> <duration>

mirage.disabled=<yellow>mirage отключён конфигурацией (mirage.enabled=false) — миров-миражей на этом бэкенде нет</yellow>
mirage.header=<gold>Миры-миражи <dark_gray>(<count>)</dark_gray></gold>
mirage.entry=  <name> <dark_gray>—</dark_gray> окружение=<environment>, измерение=<dimension>, <kind>
mirage.kind.created=<yellow>mirage (стаб, созданный плагином)</yellow>
mirage.kind.real=<green>реальный мир</green>
mirage.summary=<gray>всего: миражей <created>, слотов реальных миров <real></gray>
mirage.failure=  <red>-</red> <failure>

reload.ok.clean=<green>проверка конфигурации: OK</green> <gray>(файл v<version>, отличий от работающей конфигурации нет — большинство ключей применяются только при перезапуске)</gray>
reload.ok.changed=<green>проверка конфигурации: OK</green> <gray>(файл v<version>, изменено, но НЕ применено: <sections> — нужен перезапуск)</gray>
reload.migration=<yellow>применена миграция: v<from> -> v<to></yellow>
reload.language=<green>язык применён: сообщения теперь на <language></green>
reload.warnings=<yellow>неизвестные ключи проигнорированы: <warnings></yellow>
reload.failed=<red>проверка конфигурации: НЕ ПРОЙДЕНА</red> <dark_gray>—</dark_gray> <reason>
reload.failed.hint=<gray>работающий бэкенд не затронут (сохранена последняя рабочая конфигурация). Исправьте config.yml и выполните /dd reload снова.</gray>

no.permission=<red>У вас нет прав на использование этой команды (<permission>).</red>
unknown.subcommand=<red>Неизвестная подкоманда «<sub>».</red>
help.usage=<yellow>Использование: /dd \<info|reload|mirage></yellow>
help.info=<gray>  info    — обзор бэкенда: версия, здоровье, конфиг, измерения</gray>
help.reload=<gray>  reload  — перепроверить config.yml (язык применяется, остальное — нет)</gray>
help.mirage=<gray>  mirage  — список миров-миражей (void) и их состояние</gray>
