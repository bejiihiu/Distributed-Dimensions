# Distributed Dimensions — admin messages (English)
# MiniMessage markup. Runtime values are always substituted with unparsed
# placeholders, so markup typed by operators renders as text. Literal '<...>'
# in a value is written as '\<'.

brand.header=<gold>Distributed Dimensions</gold> <dark_gray>|</dark_gray> <gray>v<version></gray>

info.server=<gray>server:</gray> <version>
info.health.ok=<green>health: HEALTHY</green>
info.health.degraded=<red>health: DEGRADED</red>
info.health.reason=  <red>-</red> <reason>
info.config.source=<gray>config:</gray> source=<source>, file-created=<file-created>
info.config.version=<gray>config:</gray> version=<version>, migration=<migration>
info.database=<gray>database:</gray> engine=<engine>, pool=<pool-max>/<pool-min>, prefix=<prefix>
info.dimensions.header=<gray>dimensions:</gray>
info.dimension.entry=  <dimension> <dark_gray>-></dark_gray> <server>
info.mirage=<gray>mirage:</gray> <green>enabled</green>, tracked worlds: <count>
info.mirage.degraded=<yellow>mirage: <failures> world(s) failed to materialize (see /dd mirage)</yellow>
info.mirage.disabled=<gray>mirage:</gray> <yellow>disabled</yellow>
info.sync=<gray>sync:</gray> <level> <dark_gray>(phase=<phase>, wait-for-sync=<wait-for-sync>)</dark_gray>
info.sync.none=<gray>sync:</gray> <yellow>not bound (sync services unavailable)</yellow>
info.api=<gray>api:</gray> <enabled>
info.compat=<gray>compat:</gray> synthetic-events=<synthetic-events>, grant-advancements=<grant-advancements>
info.uptime=<gray>uptime:</gray> <duration>

mirage.disabled=<yellow>mirage is disabled by configuration (mirage.enabled=false) — no mirage worlds exist on this backend</yellow>
mirage.header=<gold>Mirage worlds <dark_gray>(<count>)</dark_gray></gold>
mirage.entry=  <name> <dark_gray>—</dark_gray> environment=<environment>, dimension=<dimension>, <kind>
mirage.kind.created=<yellow>mirage (stub created by the plugin)</yellow>
mirage.kind.real=<green>real world</green>
mirage.summary=<gray>total: <created> mirage(s), <real> pre-existing real world slot(s)</gray>
mirage.failure=  <red>-</red> <failure>

reload.ok.clean=<green>configuration check: OK</green> <gray>(file v<version>, no changes vs the running configuration — most keys require a restart)</gray>
reload.ok.changed=<green>configuration check: OK</green> <gray>(file v<version>, changed but NOT applied: <sections> — restart required)</gray>
reload.migration=<yellow>migration applied: v<from> -> v<to></yellow>
reload.language=<green>language applied: messages now use <language></green>
reload.warnings=<yellow>unknown keys ignored: <warnings></yellow>
reload.failed=<red>configuration check: FAILED</red> <dark_gray>—</dark_gray> <reason>
reload.failed.hint=<gray>the running backend is unaffected (last-good configuration kept). Fix config.yml and run /dd reload again.</gray>

no.permission=<red>You do not have permission to use this command (<permission>).</red>
unknown.subcommand=<red>Unknown subcommand '<sub>'.</red>
help.usage=<yellow>Usage: /dd \<info|reload|mirage></yellow>
help.info=<gray>  info    — backend overview: version, health, config, dimensions</gray>
help.reload=<gray>  reload  — re-check config.yml (applies language, reports the rest)</gray>
help.mirage=<gray>  mirage  — list mirage (void) worlds and their status</gray>
