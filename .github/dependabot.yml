version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-wrapper:
        patterns: ["gradle-wrapper"]
    # Library majors are no longer ignored: the platform runtimes (Paper 26.x, Velocity 4.x)
    # ship on fresh majors themselves, lagging behind costs more than updating.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
