name: Close stale issues and PRs
on:
  schedule:
    - cron: "30 1 * * *"

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          # default stale label is "Stale" — kept
          exempt-issue-labels: "maintainers,roadmap"
          exempt-pr-labels: "maintainers,roadmap"
          close-issue-reason: not_planned
          stale-issue-message: "Marked as stale: no activity for 60 days. Comment if this is still relevant."
          stale-pr-message: "Marked as stale: no activity for 60 days. Comment if this is still relevant."
          close-issue-message: "Closing as stale: no activity since it was marked stale. Feel free to reopen if this is still relevant."
          close-pr-message: "Closing as stale: no activity since it was marked stale. Feel free to reopen if this is still relevant."
