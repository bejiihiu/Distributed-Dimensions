name: codeql

on:
  push:
    branches: [master]
  schedule:
    # weekly, Monday 04:23 UTC
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Initialize CodeQL
        # NOTE: for Java, GitHub recommends build-mode: none (analyzes from source).
        # autobuild is kept per project decision; if the first run fails on gradle 9
        # (toolchain resolution inside the CodeQL tracer), flip to `build-mode: none`.
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: autobuild
      - name: Perform analysis
        uses: github/codeql-action/analyze@v4
