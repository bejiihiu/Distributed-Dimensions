name: build

on:
  push:
    # dev builds too: releases are cut from it, breaking it quietly is not allowed
    branches: [main, master, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # JDK 25 is the primary: all modules build with the 25 toolchain.
      # (The Foojay resolver would fetch it anyway, but installing the right one
      # up front is faster in CI.)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # setup-gradle@v6 performs wrapper-jar validation on every run,
      # so no separate wrapper-validation step is needed.
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        # --parallel: the modules are independent, let them build side by side.
        # (gradle.properties also sets org.gradle.parallel=true; this duplicate is for clarity.)
        run: ./gradlew build --parallel --stacktrace
      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: jars-${{ github.sha }}
          path: |
            paper/build/libs/*.jar
            velocity/build/libs/*.jar
            api/build/libs/*.jar
          if-no-files-found: error
