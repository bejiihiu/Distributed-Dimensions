[versions]
# Platforms. paper-api sets the minimum Paper version for the paper module,
# velocity-api the minimum Velocity version for the velocity module.
minecraft = "26.3"
paper-api = "26.3.build.+"
# Velocity 4.2.0 - first stable 4.x release (anything earlier was SNAPSHOT-only).
# Requires Java 25 at runtime, which matches our toolchain.
velocity-api = "4.2.0"

# Wire protocol: one serialization library, checked by both platforms
# (paper-api and velocity-api both carry the same gson 2.14.0, compile scope),
# bundled and relocated for determinism on both platforms.
gson = "2.14.0"
# Persistence (the plugin's own state). JDBC drivers are runtime dependencies,
# bundled into both jars with relocation; the admin must not carry extra files.
hikaricp = "7.1.0"
mongodb-driver = "5.15.0"
mysql-connector = "26.10.0"
mariadb-client = "4.0.0"
postgresql = "42.7.14"
h2 = "2.5.252"

# Common libraries. Adventure 5 is provided by both platforms at runtime
# (Paper 26.x and Velocity 4.x), so it goes to common/api as an api dependency
# for compilation, but it is cut from the shade bundles.
adventure = "5.2.0"
# Configurate is bundled into each platform jar via shadowJar with relocation.
configurate = "4.2.0"
slf4j = "2.0.20"
# Nullability annotations for public signatures. compileOnly: not needed at runtime.
annotations = "26.1.0"

shadow = "9.6.1"
run-task = "3.1.0"

# Tests. junit-bom aligns all jupiter artifact versions.
junit = "6.1.3"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
# HuskSync public compileOnly API (BukkitSyncCompleteEvent et al.), see docs/player-sync.md.
# Pinned to the build matching our platform (MC 26.3); compileOnly only, never bundled.
husksync-bukkit = { module = "net.william278.husksync:husksync-bukkit", version = "4.1.0+26.3" }

adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }

configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb-driver" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }
mariadb-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-client" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
run-velocity = { id = "xyz.jpenilla.run-velocity", version.ref = "run-task" }
